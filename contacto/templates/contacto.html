<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto</title>
</head>
<body>
<h1>Formulario de contacto</h1>
<form method="POST">
{% csrf_token %}
<p>
<label>Nombre</label><br>
<input type="text" name="nombre">
</p>
<p>
<label>Correo</label><br>
<input type="email" name="correo">
</p>
<p>
<label>Mensaje</label><br>
<textarea name="mensaje"></textarea>
</p>
<button type="submit">
Enviar
</button>
</form>
</body>
</html>
